name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-quality:
    name: Latest / quality and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflow
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/actionlint.tar.gz" \
            | sha256sum --check
          tar --extract --gzip \
            --file "$RUNNER_TEMP/actionlint/actionlint.tar.gz" \
            --directory "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -color

      - name: Install stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get --no-example

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check generated files and lockfile
        run: dart run tool/check_worktree.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze lib test tool --fatal-infos --fatal-warnings

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Test with coverage
        run: flutter test --coverage

      - name: Enforce 90 percent line coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 90

      - name: Check public API documentation
        run: dart run tool/check_dartdoc.dart

      - name: Report outdated dependencies
        run: flutter pub outdated

  minimum-sdk:
    name: Flutter 3.32 / Dart 3.8 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter 3.32.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get --no-example

      - name: Analyze package
        run: flutter analyze lib test tool --fatal-infos --fatal-warnings

      - name: Test package
        run: flutter test

  dependency-lower-bounds:
    name: Dependency lower bounds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Create isolated package copy
        run: |
          mkdir -p "$RUNNER_TEMP/lower-bounds-package"
          rsync -a --exclude=.git --exclude=.dart_tool --exclude=build \
            --exclude=coverage --exclude=doc --exclude=/pubspec.lock \
            ./ "$RUNNER_TEMP/lower-bounds-package/"

      - name: Resolve package lower bounds
        working-directory: ${{ runner.temp }}/lower-bounds-package
        run: flutter pub downgrade --no-example

      - name: Analyze package lower bounds
        working-directory: ${{ runner.temp }}/lower-bounds-package
        run: flutter analyze lib test tool --fatal-infos --fatal-warnings

      - name: Test package lower bounds
        working-directory: ${{ runner.temp }}/lower-bounds-package
        run: flutter test

      - name: Resolve example lower bounds
        working-directory: ${{ runner.temp }}/lower-bounds-package/example
        run: flutter pub downgrade

      - name: Analyze example lower bounds
        working-directory: ${{ runner.temp }}/lower-bounds-package/example
        run: flutter analyze --fatal-infos --fatal-warnings

  package-quality:
    name: Pana and publish archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Create isolated package copies
        run: |
          mkdir -p "$RUNNER_TEMP/pana-package" "$RUNNER_TEMP/publish-package"
          rsync -a --exclude=.git --exclude=.dart_tool --exclude=build \
            --exclude=coverage --exclude=doc --exclude=/pubspec.lock \
            ./ "$RUNNER_TEMP/pana-package/"
          rsync -a --exclude=.git --exclude=.dart_tool --exclude=build \
            --exclude=coverage --exclude=doc --exclude=/pubspec.lock \
            ./ "$RUNNER_TEMP/publish-package/"

      - name: Require Pana 160 out of 160
        working-directory: ${{ runner.temp }}/pana-package
        run: |
          flutter pub get --no-example
          dart pub global activate pana 0.23.18
          dart pub global run pana --json . > "$RUNNER_TEMP/pana.json"
          jq -e '.scores.grantedPoints == 160 and .scores.maxPoints == 160' \
            "$RUNNER_TEMP/pana.json"

      - name: Validate publish archive
        working-directory: ${{ runner.temp }}/publish-package
        run: dart pub publish --dry-run

      - name: Verify HTTPS metadata links
        run: |
          curl --fail --silent --show-error --location --head \
            https://github.com/ntfnd404/ephemeral_bloc >/dev/null
          curl --fail --silent --show-error --location --head \
            https://github.com/ntfnd404/ephemeral_bloc/issues >/dev/null

  ubuntu-platforms:
    name: Android, Web, Wasm, and Linux / ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: minimum
            flutter-version: 3.32.0
            app_directory: build/minimum_consumer
            consumer_platforms: android,web,linux
          - sdk: latest
            flutter-version: ""
            app_directory: example
            consumer_platforms: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Create minimum-SDK consumer
        if: matrix.sdk == 'minimum'
        shell: bash
        run: >-
          flutter create --empty
          --platforms=${{ matrix.consumer_platforms }}
          --org dev.ntfnd404
          --project-name ephemeral_bloc_consumer
          build/minimum_consumer

      - name: Connect minimum-SDK consumer to package
        if: matrix.sdk == 'minimum'
        shell: bash
        working-directory: build/minimum_consumer
        run: |
          flutter pub add "ephemeral_bloc:{path: ../..}"
          cp ../../tool/ci/minimum_consumer_main.dart lib/main.dart

      - name: Resolve platform app dependencies
        working-directory: ${{ matrix.app_directory }}
        run: flutter pub get

      - name: Build Android app
        working-directory: ${{ matrix.app_directory }}
        run: flutter build apk --debug

      - name: Build Web app
        working-directory: ${{ matrix.app_directory }}
        run: flutter build web

      - name: Build Wasm app
        working-directory: ${{ matrix.app_directory }}
        run: flutter build web --wasm

      - name: Build Linux app
        working-directory: ${{ matrix.app_directory }}
        run: flutter build linux --debug

      - name: Check platform migrations and lockfile
        run: dart run tool/check_worktree.dart

  apple-platforms:
    name: iOS and macOS / ${{ matrix.sdk }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: minimum
            flutter-version: 3.32.0
            app_directory: build/minimum_consumer
            consumer_platforms: ios,macos
          - sdk: latest
            flutter-version: ""
            app_directory: example
            consumer_platforms: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Create minimum-SDK consumer
        if: matrix.sdk == 'minimum'
        shell: bash
        run: >-
          flutter create --empty
          --platforms=${{ matrix.consumer_platforms }}
          --org dev.ntfnd404
          --project-name ephemeral_bloc_consumer
          build/minimum_consumer

      - name: Connect minimum-SDK consumer to package
        if: matrix.sdk == 'minimum'
        shell: bash
        working-directory: build/minimum_consumer
        run: |
          flutter pub add "ephemeral_bloc:{path: ../..}"
          cp ../../tool/ci/minimum_consumer_main.dart lib/main.dart

      - name: Resolve platform app dependencies
        working-directory: ${{ matrix.app_directory }}
        run: flutter pub get

      - name: Build iOS app without signing
        working-directory: ${{ matrix.app_directory }}
        run: flutter build ios --no-codesign

      - name: Build macOS app
        working-directory: ${{ matrix.app_directory }}
        run: flutter build macos --debug

      - name: Check platform migrations and lockfile
        run: dart run tool/check_worktree.dart

  windows-platform:
    name: Windows / ${{ matrix.sdk }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: minimum
            flutter-version: 3.32.0
            runner: windows-2022
            app_directory: build/minimum_consumer
            consumer_platforms: windows
          - sdk: latest
            flutter-version: ""
            runner: windows-latest
            app_directory: example
            consumer_platforms: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Create minimum-SDK consumer
        if: matrix.sdk == 'minimum'
        shell: bash
        run: >-
          flutter create --empty
          --platforms=${{ matrix.consumer_platforms }}
          --org dev.ntfnd404
          --project-name ephemeral_bloc_consumer
          build/minimum_consumer

      - name: Connect minimum-SDK consumer to package
        if: matrix.sdk == 'minimum'
        shell: bash
        working-directory: build/minimum_consumer
        run: |
          flutter pub add "ephemeral_bloc:{path: ../..}"
          cp ../../tool/ci/minimum_consumer_main.dart lib/main.dart

      - name: Resolve platform app dependencies
        working-directory: ${{ matrix.app_directory }}
        run: flutter pub get

      - name: Build Windows app
        working-directory: ${{ matrix.app_directory }}
        run: flutter build windows --debug

      - name: Check platform migrations and lockfile
        run: dart run tool/check_worktree.dart
